name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      # 1) sw.js (CORE + CACHE), index.html (meta), version.json phải khớp thư mục thật — lệch thì chạy `npm run sync`
      - run: npm run sync:check
      # 2) TypeScript checkJs: import thừa, tên không tồn tại, sai số tham số
      - run: npm run typecheck
      # 3) Unit + tích hợp (DOM giả lập, không cần trình duyệt)
      - run: npm test

      # 4) Trình duyệt thật: Chromium (Android) + WebKit (iOS Safari)
      - run: npm run e2e:install
      - run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
